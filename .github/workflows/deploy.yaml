name: CI / Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./app
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          - name: Set up python
            uses: actions/setup-python@v4
            with:
              python-version: '3.11'

          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt

          - name: Run tests
            run: |
              cd tests
              pytest
              

  build_and_deploy:
        needs: test
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
          contents: read
          id-token: write

        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: configure AWS credentials
            uses: aws-actions/configure-aws-credentials@v4
            with:
              role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
              aws-region: us-east-1

          - name: login to ECR
            id: login-ecr
            uses: aws-actions/amazon-ecr-login@v2

          - name: Build and push Docker image
            id: build-image
            env:
              ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            run: |
                docker build \
                  -t $ECR_REGISTRY/finance-tracker:${{ github.sha }} \
                  -t $ECR_REGISTRY/finance-tracker:latest \
                  ./app
                docker push $ECR_REGISTRY/finance-tracker:${{ github.sha }}
                docker push $ECR_REGISTRY/finance-tracker:latest

          - name: Deploy to ECS
            run: |
              aws ecs update-service --cluster finance-tracker-cluster --service finance-tracker-service --force-new-deployment
              aws ecs wait services-stable --cluster finance-tracker-cluster --services finance-tracker-service